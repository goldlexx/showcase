<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        :root {
            color: #222;
            font-family: Arial;
        }

        .shop {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .product {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1rem;
        }

        .product h2 {
            margin: 0;
        }

        .price {
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: 1px;
        }

        button {
            padding: 0.5rem 1rem;
            background-color: #eee;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ddd;
        }

        #basket-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
        }

        ul {
            list-style: none;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 300px;
            margin: auto;
        }

        * {
            box-sizing: border-box;
        }

        @media (max-width: 640px) {
            .shop {
                grid-template-columns: 1fr;
                width: min(100% - 32px, 420px);
            }

            ul {
                width: min(300px, calc(100% - 32px));
            }

            .product h2 {
                overflow-wrap: anywhere;
            }
        }

        #basket-items li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            line-height: 1.8;
        }

        #cart-message {
            min-height: 1.5em;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="shop">
        <div class="product">
            <h2>Lenovo Yoga</h2>
            <p>Price: <span class="price">3000</span></p>
            <button class="buy-button" data-product-id="1" type="button">Buy</button>
        </div>
        <div class="product">
            <h2>Acer Aspire</h2>
            <p>Price: <span class="price">1800</span></p>
            <button class="buy-button" data-product-id="2" type="button">Buy</button>
        </div>
        <div class="product">
            <h2>Dell Vostro</h2>
            <p>Price: <span class="price">3400</span></p>
            <button class="buy-button" data-product-id="3" type="button">Buy</button>
        </div>
    </div>
    <hr>
    <div class="basket">
        <h2 style="text-align: center;">Cart</h2>
        <ul id="basket-items" aria-label="Shopping cart"></ul>
        <p id="cart-message" role="status" aria-live="polite"></p>
        <h3 style="text-align: center;">Total price: <span id="total">0</span></h3>
    </div>
    <script src="./js/script.js"></script>
</body>
